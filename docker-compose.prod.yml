version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      # Expose API on port 8000
      - "8000:8000"
    env_file:
      - .env
    environment:
      TESSERACT_PATH: /usr/bin/tesseract
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
      PYTHONPATH: /app
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # Expose Streamlit UI on port 80 (standard web port for AWS)
      - "80:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Streamlit runs server-side, so it communicates to the backend using 
      # internal Docker DNS ('backend' is the service name)
      BACKEND_URL: http://backend:8000
    restart: always
